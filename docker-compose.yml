services:
  jetson-telemetry:
    build: .
    container_name: jetson-telemetry
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - /sys:/sys:ro
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
      - /etc/nvpmodel.conf:/etc/nvpmodel.conf:ro
      - /var/lib/nvpmodel:/var/lib/nvpmodel:ro
